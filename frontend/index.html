<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Catalog</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    nav a { margin-right: 16px; text-decoration: none; color: #0066cc; }
    .product-card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 12px 0; display: flex; gap: 16px; align-items: flex-start; }
    .product-card h3 { margin: 0 0 8px; }
    .product-card a { color: #0066cc; text-decoration: none; }
    .product-card .info { flex: 1; }
    .thumb { width: 120px; height: 90px; object-fit: cover; border-radius: 6px; background: #f0f0f0; flex: 0 0 auto; }
    .placeholder { width: 120px; height: 90px; border-radius: 6px; background: #f0f0f0; color: #999; font-size: 12px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .detail-img { max-width: 320px; width: 100%; border-radius: 8px; margin: 8px 0; display: block; background: #f0f0f0; }
    .poll-note { color: #888; font-size: 12px; margin: 4px 0 12px; }
    .sub-card { border: 1px solid #eee; border-left: 3px solid #0066cc; border-radius: 6px; padding: 10px 12px; margin: 8px 0; }
    .sub-card p { margin: 6px 0 0; }
    .muted { color: #888; font-weight: normal; }
    .stars { color: #f5a623; letter-spacing: 1px; }
    .detail-section { margin-top: 24px; }
    .sub-card { position: relative; }
    .del-btn { position: absolute; top: 8px; right: 8px; background: #fff; color: #c00; border: 1px solid #e0b4b4; padding: 2px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; }
    .del-btn:hover { background: #c00; color: #fff; }
    form label { display: block; margin: 8px 0 4px; }
    form input { width: 100%; padding: 6px; box-sizing: border-box; margin-bottom: 8px; }
    button { background: #0066cc; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
    .search-bar { display: flex; gap: 8px; margin: 12px 0; }
    .search-bar input { flex: 1; padding: 6px; box-sizing: border-box; }
    .search-bar button { white-space: nowrap; }
    #app { min-height: 400px; }
  </style>
</head>
<body>
  <nav>
    <a href="#/">Home</a>
    <a href="#/create">Add Product</a>
  </nav>
  <div id="app">Loading...</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
